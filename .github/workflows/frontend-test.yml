name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 時刻表示のテストがローカルタイムを前提にしている（CI 既定の UTC だと落ちる）
      TZ: Asia/Tokyo

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      # tsconfig が "files": [] + project references のため、--noEmit ではなく -b で全ファイルを検査する
      - name: 型チェック（tsc -b）
        run: npx tsc -b --force

      # exhaustive-deps の既存 warning 19 件は別途対応のため、エラーのみで落とす
      - name: Lint（eslint）
        run: npx eslint .

      - name: テストを実行
        run: npx vitest run

      - name: ビルドを確認
        run: npx vite build
