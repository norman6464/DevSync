name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Atlas をセットアップ
        uses: ariga/setup-atlas@v0
        with:
          version: "v1.3.3"

      - name: 依存関係をダウンロード
        run: go mod download
        working-directory: ./backend

      - name: ビルドを確認
        run: go build ./...
        working-directory: ./backend

      - name: go vet を実行
        run: go vet ./...
        working-directory: ./backend

      - name: 依存方向をチェック（archlint）
        run: go run ./cmd/archlint .
        working-directory: ./backend

      - name: db/schema/*.hcl が素のDBへエラーなく適用できるか検証
        run: atlas schema apply --env local --auto-approve
        working-directory: ./backend
        env:
          ATLAS_DB_URL: postgres://devsync:devsync@localhost:5432/devsync?sslmode=disable

      - name: ユニットテストを実行
        run: go test ./... -cover -coverprofile=coverage.out
        working-directory: ./backend

      - name: カバレッジレポートをアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out
