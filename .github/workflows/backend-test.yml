name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN はリポジトリの読み取りのみで足りる（チェックアウトとキャッシュ利用のみ）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Atlas をセットアップ
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: "v1.3.3"

      - name: sqlc をセットアップ
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"

      - name: 依存関係をダウンロード
        run: go mod download
        working-directory: ./backend

      - name: ビルドを確認
        run: go build ./...
        working-directory: ./backend

      - name: go vet を実行
        run: go vet ./...
        working-directory: ./backend

      - name: 依存方向をチェック（archlint）
        run: go run ./cmd/archlint .
        working-directory: ./backend

      - name: db/schema/*.hcl が素のDBへエラーなく適用できるか検証
        run: atlas schema apply --env local --auto-approve
        working-directory: ./backend
        env:
          ATLAS_DB_URL: postgres://devsync:devsync@localhost:5432/devsync?sslmode=disable

      - name: sqlc生成コードが db/queries と db/schema から再生成しても変わらないか検証
        run: |
          make db-schema-sql
          sqlc generate
          git diff --exit-code -- internal/adapter/persistence/sqlcgen
        working-directory: ./backend

      - name: ユニットテストを実行
        run: go test ./... -cover -coverprofile=coverage.out
        working-directory: ./backend

      - name: カバレッジレポートをアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out
