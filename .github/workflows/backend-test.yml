name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN はリポジトリの読み取りのみで足りる（チェックアウトとキャッシュ利用のみ）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Atlas をセットアップ
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: "v1.3.3"

      - name: sqlc をセットアップ
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"

      - name: 依存関係をダウンロード
        run: go mod download
        working-directory: ./backend

      # go.mod / go.sum が tidy か検証する（未使用依存・取りこぼしをCIで検知）。
      - name: go mod tidy が差分を生まないか検証
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum is not tidy. Run 'go mod tidy' in backend/ and commit."
            git diff go.mod go.sum
            exit 1
          fi
        working-directory: ./backend

      - name: ビルドを確認
        run: go build ./...
        working-directory: ./backend

      # gofumptはgofmtの上位互換で、空行・連続宣言の整列など「人が迷う整形」も
      # 機械的に統一する。1ファイルでも未整形なら失敗させ、ローカルでは
      # `gofumpt -w .` で直してもらう運用にする。
      - name: gofumpt チェック
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          unformatted=$("$(go env GOPATH)/bin/gofumpt" -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下のファイルがgofumpt未整形です:"
            echo "$unformatted"
            echo "backend/ で 'gofumpt -w .' を実行してコミットしてください。"
            exit 1
          fi
        working-directory: ./backend

      - name: go vet を実行
        run: go vet ./...
        working-directory: ./backend

      # golangci-lint(v2)で複数linterを一括実行する。設定は backend/.golangci.yml。
      # defaultのerrcheck/govet/ineffassign/staticcheck/unusedに加え、
      # errorlint・bodyclose・gosec・misspell・unconvert・nilerr・contextcheck・
      # wastedassignを有効化している。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      # govulncheckはGo公式の脆弱性スキャナ。実際に呼んでいるコードパスに該当する
      # 既知CVEだけを報告する。stdlibのCVEはGoのパッチ追随次第で頻出するため、
      # CIを止めずに「可視化」目的の非ブロッキング（continue-on-error）にする。
      - name: govulncheck（advisory）
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: ./backend

      - name: 依存方向をチェック（archlint）
        run: go run ./cmd/archlint .
        working-directory: ./backend

      # atlas.hclは持たず、Makefile同様に --url/--to/--dev-url を都度指定する
      # （db-schema-applyターゲットはローカルでの対話承認を前提としており--auto-approveを
      # 持たないため、CIではatlasを直接呼ぶ）。
      - name: internal/infra/database/schema/schema.hcl が素のDBへエラーなく適用できるか検証
        run: |
          atlas schema apply \
            --url "$ATLAS_DB_URL" \
            --to "file://internal/infra/database/schema/schema.hcl" \
            --dev-url "docker://postgres/18.4/dev" \
            --auto-approve
        working-directory: ./backend
        env:
          ATLAS_DB_URL: postgres://devsync:devsync@localhost:5432/devsync?sslmode=disable

      - name: sqlc生成コードが queries と schema から再生成しても変わらないか検証
        run: |
          make db-schema-sql
          sqlc generate
          git diff --exit-code -- internal/adapter/persistence/sqlcgen
        working-directory: ./backend

      # race detectorで並行コードのデータ競合をCIで検出する。
      - name: ユニットテストを実行（race + カバレッジ）
        run: go test -race ./... -cover -coverprofile=coverage.out
        working-directory: ./backend

      - name: カバレッジレポートをアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out

      - name: go build（trimpath + シンボル除去）
        run: go build -trimpath -ldflags="-s -w" -o /tmp/devsync-backend ./cmd/server
        working-directory: ./backend

      - name: バイナリサイズを表示
        run: ls -lh /tmp/devsync-backend
