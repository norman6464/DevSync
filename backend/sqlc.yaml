version: "2"
sql:
  - engine: "postgresql"
    # internal/infra/database/schema/*.hcl（Atlas の正）から `make db-schema-sql` で
    # 書き出したSQL。手書きしない生成物のため .gitignore 済み。
    # sqlc はHCLを直接読めないための橋渡し。
    # (schema/ ディレクトリ自体に置くと、Atlas がそのディレクトリをHCLソースとして
    #  読む際にSQLファイルと衝突して "ambiguous schema" エラーになるため、
    #  1つ上の internal/infra/database/ 直下に置く)
    schema: "internal/infra/database/schema_generated.sql"
    queries: "internal/adapter/persistence/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/persistence/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        emit_pointers_for_null_types: true
