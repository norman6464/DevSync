version: "2"
sql:
  - engine: "postgresql"
    # internal/infra/database/schema/schema.hcl（Atlas の正）から `make db-schema-sql` で
    # 書き出したSQL。手書きしない生成物だがコミット対象（internal/infra/database/schema.go が
    # go:embed してバイナリへ埋め込み、空DBへの起動時自己適用に使うため）。
    # sqlc はHCLを直接読めないための橋渡し。
    schema: "internal/infra/database/schema/schema.gen.sql"
    queries: "internal/adapter/persistence/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/persistence/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        emit_pointers_for_null_types: true
