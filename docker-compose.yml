services:
  db:
    image: postgres:18.4-alpine
    container_name: devsync-db
    environment:
      POSTGRES_USER: ${DB_USER:-devsync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devsync}
      POSTGRES_DB: ${DB_NAME:-devsync}
    ports:
      - "5432:5432"
    # postgres 18+ イメージは major version 別サブディレクトリで管理するため
    # マウント先はデータディレクトリ本体ではなく親の /var/lib/postgresql にする。
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devsync}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # スキーマ差分計算専用の使い捨てDB（Atlasのdev-db）。データは永続化しない。
  atlas-dev-db:
    image: postgres:18.4-alpine
    container_name: devsync-atlas-dev-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # db/schema/*.hcl（Atlas宣言的スキーマ）を db へ適用してから終了する一回限りのジョブ。
  # backend はこれの成功を待って起動する。
  db-migrate:
    image: arigaio/atlas:latest
    container_name: devsync-db-migrate
    volumes:
      - ./backend/db/schema:/db/schema:ro
    command:
      - schema
      - apply
      - -u
      - postgres://${DB_USER:-devsync}:${DB_PASSWORD:-devsync}@db:5432/${DB_NAME:-devsync}?sslmode=disable
      - --to
      - file:///db/schema
      - --dev-url
      - postgres://dev:dev@atlas-dev-db:5432/dev?sslmode=disable
      - --auto-approve
    depends_on:
      db:
        condition: service_healthy
      atlas-dev-db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devsync-backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-devsync}
      DB_PASSWORD: ${DB_PASSWORD:-devsync}
      DB_NAME: ${DB_NAME:-devsync}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET環境変数を設定してください}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:5173/github/callback}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URL: ${SPOTIFY_REDIRECT_URL:-http://localhost:5173/spotify/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@devsync.dev}
      APP_URL: ${APP_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: devsync-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devsync-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
